<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Info Hub - 信息中心 v3</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui; max-width: 1400px; margin: 0 auto; padding: 20px; background: #1a1a2e; color: #eee; }
        h1, h2, h3 { color: #fff; margin-top: 0; }
        .section { background: #16213e; padding: 20px; margin: 15px 0; border-radius: 8px; }
        input, select, button { padding: 10px 14px; margin: 5px; border-radius: 6px; border: 1px solid #444; background: #0f3460; color: #fff; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #e94560; }
        button { cursor: pointer; background: #e94560; border: none; font-weight: 500; }
        button:hover { background: #ff6b6b; }
        button.secondary { background: #0f3460; border: 1px solid #444; }
        button.secondary:hover { background: #1a4a7a; }
        .results { margin-top: 15px; max-height: 500px; overflow-y: auto; }
        .item { background: #0f3460; padding: 12px 15px; margin: 8px 0; border-radius: 6px; border-left: 3px solid #e94560; }
        .item:hover { background: #1a4a7a; }
        .score { color: #4ade80; font-size: 12px; }
        .meta { color: #888; font-size: 12px; margin-top: 5px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 15px 0; }
        .stat-card { background: #0f3460; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-value { font-size: 28px; font-weight: bold; color: #e94560; }
        .stat-label { color: #888; font-size: 13px; margin-top: 5px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab { padding: 12px 20px; background: #0f3460; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .tab:hover { background: #1a4a7a; }
        .tab.active { background: #e94560; }
        pre { background: #0a0a1a; padding: 15px; overflow-x: auto; font-size: 12px; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background: #0f3460; position: sticky; top: 0; }
        .entity-tag { display: inline-block; padding: 4px 10px; margin: 3px; border-radius: 15px; font-size: 12px; cursor: pointer; }
        .entity-tag:hover { opacity: 0.8; }
        .entity-tag.person { background: #3b82f6; }
        .entity-tag.company { background: #10b981; }
        .entity-tag.money { background: #f59e0b; }
        .entity-tag.date { background: #8b5cf6; }
        .entity-tag.product { background: #ec4899; }
        .entity-tag.location { background: #06b6d4; }
        .entity-tag.project { background: #84cc16; }
        .category-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; margin-left: 8px; }
        .category-badge.external { background: #3b82f6; }
        .category-badge.internal { background: #6b7280; }
        .category-badge.finance { background: #f59e0b; }
        .category-badge.sales { background: #10b981; }
        .category-badge.hr { background: #8b5cf6; }
        .category-badge.technical { background: #06b6d4; }
        .category-badge.legal { background: #ef4444; }
        .category-badge.marketing { background: #ec4899; }
        .category-badge.procurement { background: #84cc16; }
        .top-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; }
        .top-card { background: #0f3460; padding: 15px; border-radius: 8px; }
        .top-card h4 { margin: 0 0 10px 0; color: #e94560; }
        .top-item { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #333; }
        .top-item:last-child { border-bottom: none; }
        .count-badge { background: #e94560; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
        .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 15px; }
        .loading { text-align: center; padding: 40px; color: #888; }
        .email-preview { max-height: 100px; overflow: hidden; color: #aaa; font-size: 13px; margin-top: 8px; }
        /* Graph specific styles */
        #graphContainer { width: 100%; height: 600px; border: 1px solid #333; border-radius: 8px; background: #0a0a1a; }
        .graph-controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; align-items: center; }
        .relation-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
        .legend-item { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: #0f3460; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .legend-item:hover { opacity: 0.8; }
        .legend-color { width: 12px; height: 12px; border-radius: 50%; }
        .node-detail { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #16213e; padding: 25px; border-radius: 12px; border: 2px solid #e94560; z-index: 1000; min-width: 350px; max-width: 500px; display: none; }
        .node-detail-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 999; display: none; }
        .node-detail h3 { margin: 0 0 15px 0; color: #e94560; }
        .node-detail .close-btn { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 20px; color: #888; }
        .node-detail .close-btn:hover { color: #fff; }
        .relation-list { max-height: 300px; overflow-y: auto; }
        .relation-item { padding: 8px; margin: 5px 0; background: #0f3460; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <h1>Info Hub - 信息中心 v3</h1>

    <div class="tabs">
        <div class="tab active" onclick="showTab('search')">🔍 语义搜索</div>
        <div class="tab" onclick="showTab('entities')">🏷️ 实体搜索</div>
        <div class="tab" onclick="showTab('graph')">🕸️ 关系图谱</div>
        <div class="tab" onclick="showTab('emails')">📬 邮件浏览</div>
        <div class="tab" onclick="showTab('insights')">📊 业务洞察</div>
        <div class="tab" onclick="showTab('stats')">⚙️ 系统统计</div>
    </div>

    <!-- 语义搜索 -->
    <div id="search" class="section">
        <h2>🔍 语义搜索</h2>
        <p style="color:#888;margin-bottom:15px;">输入自然语言查询，例如："关于SpaceX的合同讨论" 或 "采购订单超过100万"</p>
        <div class="filter-row">
            <input type="text" id="searchQuery" placeholder="输入搜索内容..." style="width: 450px;" onkeypress="if(event.key==='Enter')doSearch()">
            <input type="number" id="searchLimit" value="20" min="1" max="100" style="width: 70px;">
            <button onclick="doSearch()">搜索</button>
        </div>
        <div id="searchResults" class="results"></div>
    </div>

    <!-- 实体搜索 -->
    <div id="entities" class="section" style="display:none;">
        <h2>🏷️ 实体搜索</h2>
        <p style="color:#888;margin-bottom:15px;">搜索邮件中提取的人名、公司、金额等实体</p>
        <div class="filter-row">
            <select id="entityType">
                <option value="">所有类型</option>
                <option value="person">👤 人名</option>
                <option value="company">🏢 公司</option>
                <option value="money">💰 金额</option>
                <option value="product">📦 产品</option>
                <option value="project">📋 项目</option>
                <option value="location">📍 地点</option>
                <option value="date">📅 日期</option>
            </select>
            <input type="text" id="entityText" placeholder="搜索实体名称..." style="width: 300px;" onkeypress="if(event.key==='Enter')searchEntities()">
            <input type="number" id="entityLimit" value="50" min="1" max="200" style="width: 70px;">
            <button onclick="searchEntities()">搜索实体</button>
            <button class="secondary" onclick="loadEntityStats()">刷新统计</button>
        </div>
        <div id="entityStats" class="stats-grid"></div>
        <div id="entityResults" class="results"></div>
    </div>

    <!-- 关系图谱 - 新增 -->
    <div id="graph" class="section" style="display:none;">
        <h2>🕸️ 关系图谱</h2>
        <p style="color:#888;margin-bottom:15px;">可视化实体关系网络 - 基于邮件共现分析</p>

        <div class="graph-controls">
            <select id="graphRelationType" onchange="filterGraph()">
                <option value="">所有关系类型</option>
                <option value="works_at">🏢 works_at (任职)</option>
                <option value="colleague">👥 colleague (同事)</option>
                <option value="business_partner">🤝 business_partner (商业伙伴)</option>
                <option value="contact">📇 contact (联系人)</option>
                <option value="works_on">📋 works_on (参与项目)</option>
                <option value="owns">🏛️ owns (拥有)</option>
                <option value="supervisor">👑 supervisor (上级)</option>
                <option value="subordinate">👤 subordinate (下级)</option>
            </select>
            <select id="graphEntityType" onchange="filterGraph()">
                <option value="">所有实体类型</option>
                <option value="person">👤 person</option>
                <option value="company">🏢 company</option>
                <option value="project">📋 project</option>
            </select>
            <input type="text" id="graphSearch" placeholder="搜索实体..." style="width: 200px;" onkeypress="if(event.key==='Enter')searchInGraph()">
            <button onclick="searchInGraph()">定位</button>
            <button class="secondary" onclick="loadGraphData()">刷新图谱</button>
            <button class="secondary" onclick="resetGraphView()">重置视图</button>
        </div>

        <div class="stats-grid" id="graphStats"></div>

        <div class="relation-legend" id="relationLegend"></div>

        <div id="graphContainer"></div>

        <div style="margin-top:15px; color:#888; font-size:12px;">
            提示: 滚轮缩放 | 拖拽平移 | 点击节点查看详情 | 双击聚焦节点
        </div>
    </div>

    <!-- 邮件浏览 -->
    <div id="emails" class="section" style="display:none;">
        <h2>📬 邮件浏览</h2>
        <div class="filter-row">
            <select id="emailCategory">
                <option value="">所有分类</option>
                <option value="external">📤 外部邮件</option>
                <option value="internal">📥 内部邮件</option>
                <option value="finance">💵 财务</option>
                <option value="sales">💼 销售</option>
                <option value="hr">👥 人事</option>
                <option value="technical">🔧 技术</option>
                <option value="legal">⚖️ 法务</option>
                <option value="marketing">📢 营销</option>
                <option value="procurement">🛒 采购</option>
            </select>
            <select id="emailFolder">
                <option value="">所有文件夹</option>
                <option value="inbox">收件箱</option>
                <option value="sentitems">已发送</option>
            </select>
            <input type="number" id="emailLimit" value="30" style="width: 70px;">
            <button onclick="loadEmails()">加载邮件</button>
        </div>
        <div id="emailResults" class="results"></div>
    </div>

    <!-- 业务洞察 -->
    <div id="insights" class="section" style="display:none;">
        <h2>📊 业务洞察</h2>
        <button onclick="loadInsights()">加载洞察数据</button>
        <div id="insightsStats" class="stats-grid" style="margin-top:20px;"></div>
        <div class="top-list" id="topLists" style="margin-top:20px;"></div>
    </div>

    <!-- 系统统计 -->
    <div id="stats" class="section" style="display:none;">
        <h2>⚙️ 系统统计</h2>
        <button onclick="loadAllStats()">加载所有统计</button>
        <div id="statsResults"></div>
    </div>

    <!-- Node Detail Modal -->
    <div class="node-detail-overlay" id="nodeDetailOverlay" onclick="closeNodeDetail()"></div>
    <div class="node-detail" id="nodeDetail">
        <span class="close-btn" onclick="closeNodeDetail()">&times;</span>
        <h3 id="nodeDetailTitle"></h3>
        <div id="nodeDetailContent"></div>
    </div>

    <script>
        const API = '';
        let graphNetwork = null;
        let graphData = null;
        let allNodes = [];
        let allEdges = [];

        // 关系类型颜色映射
        const relationColors = {
            works_at: '#3b82f6',
            colleague: '#10b981',
            business_partner: '#f59e0b',
            contact: '#8b5cf6',
            works_on: '#06b6d4',
            owns: '#ec4899',
            supervisor: '#ef4444',
            subordinate: '#84cc16'
        };

        // 实体类型颜色
        const entityColors = {
            person: '#3b82f6',
            company: '#10b981',
            project: '#f59e0b'
        };

        function showTab(name) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(name).style.display = 'block';
            event.target.classList.add('active');

            if (name === 'entities') loadEntityStats();
            if (name === 'insights') loadInsights();
            if (name === 'graph' && !graphData) loadGraphData();
        }

        // ===== 关系图谱 =====
        async function loadGraphData() {
            document.getElementById('graphContainer').innerHTML = '<div class="loading">加载图谱数据中...</div>';

            try {
                // 优先加载带关系类型的图谱
                let res = await fetch('/static/email-intel/graph_with_relations_vllm.json');
                if (!res.ok) {
                    res = await fetch('/static/email-intel/graph_with_relations_v4.json');
                }
                if (!res.ok) {
                    res = await fetch('/static/email-intel/smart_graph_v5.json');
                }

                graphData = await res.json();
                console.log('Graph data loaded:', graphData);

                // 显示统计
                const stats = graphData.stats || {};
                document.getElementById('graphStats').innerHTML = `
                    <div class="stat-card"><div class="stat-value">${(stats.emails_processed || 0).toLocaleString()}</div><div class="stat-label">处理邮件数</div></div>
                    <div class="stat-card"><div class="stat-value">${(stats.unique_entities || graphData.top_entities?.length || 0).toLocaleString()}</div><div class="stat-label">唯一实体</div></div>
                    <div class="stat-card"><div class="stat-value">${(stats.strong_relationships || graphData.relationships?.length || 0).toLocaleString()}</div><div class="stat-label">关系数</div></div>
                `;

                // 构建图例
                buildLegend();

                // 渲染图谱
                renderGraph();

            } catch (e) {
                document.getElementById('graphContainer').innerHTML = `<p style="color:#ef4444;padding:20px;">加载失败: ${e.message}</p>`;
                console.error('Graph load error:', e);
            }
        }

        function buildLegend() {
            let html = '';
            for (const [type, color] of Object.entries(relationColors)) {
                const count = (graphData.relationships || graphData.top_relationships || [])
                    .filter(r => r.relation_type === type).length;
                if (count > 0) {
                    html += `<div class="legend-item" onclick="filterByRelation('${type}')">
                        <span class="legend-color" style="background:${color}"></span>
                        <span>${type} (${count})</span>
                    </div>`;
                }
            }
            document.getElementById('relationLegend').innerHTML = html;
        }

        function renderGraph(filteredRelations = null) {
            const relationships = filteredRelations || graphData.relationships || graphData.top_relationships || [];
            const entities = graphData.top_entities || [];

            // 限制显示数量以提高性能
            const maxNodes = 200;
            const maxEdges = 500;

            // 构建节点 (从关系中提取)
            const nodeMap = new Map();

            for (const rel of relationships.slice(0, maxEdges)) {
                if (!nodeMap.has(rel.entity1)) {
                    nodeMap.set(rel.entity1, {
                        id: rel.entity1,
                        label: rel.entity1.length > 15 ? rel.entity1.slice(0,15) + '...' : rel.entity1,
                        fullLabel: rel.entity1,
                        type: rel.entity1_type || 'unknown',
                        color: entityColors[rel.entity1_type] || '#888',
                        shape: rel.entity1_type === 'company' ? 'diamond' : 'dot',
                        size: 15
                    });
                }
                if (!nodeMap.has(rel.entity2)) {
                    nodeMap.set(rel.entity2, {
                        id: rel.entity2,
                        label: rel.entity2.length > 15 ? rel.entity2.slice(0,15) + '...' : rel.entity2,
                        fullLabel: rel.entity2,
                        type: rel.entity2_type || 'unknown',
                        color: entityColors[rel.entity2_type] || '#888',
                        shape: rel.entity2_type === 'company' ? 'diamond' : 'dot',
                        size: 15
                    });
                }
            }

            // 限制节点数
            allNodes = Array.from(nodeMap.values()).slice(0, maxNodes);
            const nodeIds = new Set(allNodes.map(n => n.id));

            // 构建边
            allEdges = relationships
                .filter(r => nodeIds.has(r.entity1) && nodeIds.has(r.entity2))
                .slice(0, maxEdges)
                .map((rel, i) => ({
                    id: i,
                    from: rel.entity1,
                    to: rel.entity2,
                    label: rel.relation_type || '',
                    color: relationColors[rel.relation_type] || '#666',
                    width: Math.min(Math.log(rel.count + 1) * 2, 5),
                    arrows: 'to',
                    relationType: rel.relation_type,
                    count: rel.count,
                    title: `${rel.entity1} → ${rel.relation_type || 'related'} → ${rel.entity2} (${rel.count}次)`
                }));

            // 创建 vis.js 网络
            const container = document.getElementById('graphContainer');
            container.innerHTML = '';

            const data = {
                nodes: new vis.DataSet(allNodes),
                edges: new vis.DataSet(allEdges)
            };

            const options = {
                nodes: {
                    font: { color: '#fff', size: 12 },
                    borderWidth: 2,
                    shadow: true
                },
                edges: {
                    font: { color: '#888', size: 10, align: 'middle' },
                    smooth: { type: 'continuous' },
                    arrows: { to: { scaleFactor: 0.5 } }
                },
                physics: {
                    stabilization: { iterations: 100 },
                    barnesHut: {
                        gravitationalConstant: -2000,
                        springLength: 150,
                        springConstant: 0.04
                    }
                },
                interaction: {
                    hover: true,
                    tooltipDelay: 200
                }
            };

            graphNetwork = new vis.Network(container, data, options);

            // 点击事件
            graphNetwork.on('click', function(params) {
                if (params.nodes.length > 0) {
                    showNodeDetail(params.nodes[0]);
                }
            });

            // 双击聚焦
            graphNetwork.on('doubleClick', function(params) {
                if (params.nodes.length > 0) {
                    graphNetwork.focus(params.nodes[0], {
                        scale: 1.5,
                        animation: true
                    });
                }
            });
        }

        function filterGraph() {
            if (!graphData) return;

            const relType = document.getElementById('graphRelationType').value;
            const entType = document.getElementById('graphEntityType').value;

            let filtered = graphData.relationships || graphData.top_relationships || [];

            if (relType) {
                filtered = filtered.filter(r => r.relation_type === relType);
            }

            if (entType) {
                filtered = filtered.filter(r =>
                    r.entity1_type === entType || r.entity2_type === entType
                );
            }

            renderGraph(filtered);
        }

        function filterByRelation(type) {
            document.getElementById('graphRelationType').value = type;
            filterGraph();
        }

        function searchInGraph() {
            const query = document.getElementById('graphSearch').value.toLowerCase();
            if (!query || !graphNetwork) return;

            const found = allNodes.find(n =>
                n.fullLabel.toLowerCase().includes(query) ||
                n.id.toLowerCase().includes(query)
            );

            if (found) {
                graphNetwork.selectNodes([found.id]);
                graphNetwork.focus(found.id, {
                    scale: 1.5,
                    animation: true
                });
                showNodeDetail(found.id);
            } else {
                alert('未找到匹配的实体');
            }
        }

        function resetGraphView() {
            if (graphNetwork) {
                graphNetwork.fit({ animation: true });
            }
            document.getElementById('graphRelationType').value = '';
            document.getElementById('graphEntityType').value = '';
            document.getElementById('graphSearch').value = '';
            renderGraph();
        }

        function showNodeDetail(nodeId) {
            const node = allNodes.find(n => n.id === nodeId);
            if (!node) return;

            // 找出所有相关的边
            const relatedEdges = allEdges.filter(e => e.from === nodeId || e.to === nodeId);

            document.getElementById('nodeDetailTitle').innerHTML = `
                <span class="entity-tag ${node.type}">${node.type}</span> ${node.fullLabel}
            `;

            let html = `<p style="color:#888;">关联关系: ${relatedEdges.length} 条</p>`;
            html += '<div class="relation-list">';

            for (const edge of relatedEdges) {
                const other = edge.from === nodeId ? edge.to : edge.from;
                const direction = edge.from === nodeId ? '→' : '←';
                html += `<div class="relation-item">
                    <span>${direction} ${other}</span>
                    <span style="color:${edge.color}">${edge.relationType || 'related'} (${edge.count})</span>
                </div>`;
            }
            html += '</div>';

            // 添加搜索按钮
            html += `<button onclick="searchByEntity('${node.fullLabel}')" style="margin-top:15px;width:100%;">
                🔍 搜索相关邮件
            </button>`;

            document.getElementById('nodeDetailContent').innerHTML = html;
            document.getElementById('nodeDetailOverlay').style.display = 'block';
            document.getElementById('nodeDetail').style.display = 'block';
        }

        function closeNodeDetail() {
            document.getElementById('nodeDetailOverlay').style.display = 'none';
            document.getElementById('nodeDetail').style.display = 'none';
        }

        // ===== 语义搜索 =====
        async function doSearch() {
            const q = document.getElementById('searchQuery').value;
            const limit = document.getElementById('searchLimit').value;
            if (!q) return alert('请输入搜索内容');

            document.getElementById('searchResults').innerHTML = '<div class="loading">搜索中...</div>';

            try {
                const res = await fetch(`${API}/api/info-hub/search?q=${encodeURIComponent(q)}&limit=${limit}`);
                const data = await res.json();

                let html = `<p style="color:#4ade80;">找到 ${data.count} 条结果</p>`;
                for (const r of data.results) {
                    const cat = r.category ? `<span class="category-badge ${r.category}">${r.category}</span>` : '';
                    html += `<div class="item">
                        <strong>${r.subject || '(无主题)'}</strong>${cat}
                        <span class="score">相似度: ${(r.score * 100).toFixed(1)}%</span>
                        <div class="meta">${r.from || ''} → ${r.to || ''} | ${r.date || ''}</div>
                        ${r.entities ? '<div style="margin-top:8px;">' + renderEntityTags(r.entities.slice(0,8)) + '</div>' : ''}
                    </div>`;
                }
                document.getElementById('searchResults').innerHTML = html;
            } catch (e) {
                document.getElementById('searchResults').innerHTML = `<p style="color:#ef4444;">错误: ${e.message}</p>`;
            }
        }

        // ===== 实体搜索 =====
        async function loadEntityStats() {
            try {
                const res = await fetch(`${API}/api/info-hub/entities/stats`);
                const data = await res.json();

                let html = `
                    <div class="stat-card"><div class="stat-value">${data.total_processed?.toLocaleString() || 0}</div><div class="stat-label">已处理邮件</div></div>
                `;

                const typeEmoji = {person:'👤',company:'🏢',money:'💰',product:'📦',project:'📋',location:'📍',date:'📅',phone_number:'📞',email_address:'📧'};
                for (const [type, stats] of Object.entries(data.entity_types || {})) {
                    html += `<div class="stat-card">
                        <div class="stat-value">${stats.unique?.toLocaleString() || 0}</div>
                        <div class="stat-label">${typeEmoji[type] || ''} ${type}</div>
                    </div>`;
                }
                document.getElementById('entityStats').innerHTML = html;
            } catch (e) {
                console.error('加载实体统计失败:', e);
            }
        }

        async function searchEntities() {
            const type = document.getElementById('entityType').value;
            const text = document.getElementById('entityText').value;
            const limit = document.getElementById('entityLimit').value;

            document.getElementById('entityResults').innerHTML = '<div class="loading">搜索中...</div>';

            try {
                let url = `${API}/api/info-hub/entities/search?limit=${limit}`;
                if (type) url += `&type=${type}`;
                if (text) url += `&text=${encodeURIComponent(text)}`;

                const res = await fetch(url);
                const data = await res.json();

                let html = `<p style="color:#4ade80;">找到 ${data.count} 个实体</p>`;
                html += '<table><thead><tr><th>实体</th><th>类型</th><th>出现次数</th><th>相关邮件</th></tr></thead><tbody>';

                for (const e of data.results) {
                    html += `<tr>
                        <td><span class="entity-tag ${e.type}" onclick="searchByEntity('${e.text}')">${e.text}</span></td>
                        <td>${e.type}</td>
                        <td><span class="count-badge">${e.count}</span></td>
                        <td style="font-size:11px;color:#888;">${e.sample_emails?.slice(0,3).join(', ') || ''}</td>
                    </tr>`;
                }
                html += '</tbody></table>';
                document.getElementById('entityResults').innerHTML = html;
            } catch (e) {
                document.getElementById('entityResults').innerHTML = `<p style="color:#ef4444;">错误: ${e.message}</p>`;
            }
        }

        function searchByEntity(text) {
            closeNodeDetail();
            document.getElementById('searchQuery').value = text;
            showTab('search');
            setTimeout(() => {
                document.querySelector('.tab').click();
                doSearch();
            }, 100);
        }

        function renderEntityTags(entities) {
            if (!entities || !entities.length) return '';
            return entities.map(e => `<span class="entity-tag ${e.type}">${e.text}</span>`).join('');
        }

        // ===== 邮件浏览 =====
        async function loadEmails() {
            const category = document.getElementById('emailCategory').value;
            const folder = document.getElementById('emailFolder').value;
            const limit = document.getElementById('emailLimit').value;

            document.getElementById('emailResults').innerHTML = '<div class="loading">加载中...</div>';

            try {
                let url = `${API}/api/info-hub/emails?limit=${limit}`;
                if (folder) url += `&folder=${folder}`;
                if (category) url += `&category=${category}`;

                const res = await fetch(url);
                const data = await res.json();

                let html = `<p style="color:#4ade80;">共 ${data.emails?.length || 0} 封邮件</p>`;
                for (const e of (data.emails || [])) {
                    const cat = e.category ? `<span class="category-badge ${e.category}">${e.category}</span>` : '';
                    html += `<div class="item">
                        <strong>${e.subject || '(无主题)'}</strong>${cat}
                        <div class="meta">${e.from?.name || e.from?.address || ''} | ${new Date(e.received_at).toLocaleString()}</div>
                        ${e.entities ? '<div style="margin-top:8px;">' + renderEntityTags(e.entities.slice(0,6)) + '</div>' : ''}
                    </div>`;
                }
                document.getElementById('emailResults').innerHTML = html;
            } catch (e) {
                document.getElementById('emailResults').innerHTML = `<p style="color:#ef4444;">错误: ${e.message}</p>`;
            }
        }

        // ===== 业务洞察 =====
        async function loadInsights() {
            document.getElementById('insightsStats').innerHTML = '<div class="loading">加载中...</div>';

            try {
                const [entityRes, catRes] = await Promise.all([
                    fetch(`${API}/api/info-hub/entities/stats`),
                    fetch(`${API}/api/info-hub/entities/search?type=person&limit=10`),
                ]);

                const entityData = await entityRes.json();
                const topPeople = await catRes.json();

                let statsHtml = '';
                const catEmoji = {external:'📤',internal:'📥',finance:'💵',sales:'💼',hr:'👥',technical:'🔧',legal:'⚖️',marketing:'📢',procurement:'🛒'};
                for (const [cat, count] of Object.entries(entityData.categories || {})) {
                    statsHtml += `<div class="stat-card">
                        <div class="stat-value">${count.toLocaleString()}</div>
                        <div class="stat-label">${catEmoji[cat] || ''} ${cat}</div>
                    </div>`;
                }
                document.getElementById('insightsStats').innerHTML = statsHtml;

                let topHtml = '';

                topHtml += `<div class="top-card"><h4>👤 高频联系人 Top 10</h4>`;
                for (const p of topPeople.results?.slice(0,10) || []) {
                    topHtml += `<div class="top-item"><span onclick="searchByEntity('${p.text}')" style="cursor:pointer;">${p.text}</span><span class="count-badge">${p.count}</span></div>`;
                }
                topHtml += '</div>';

                const compRes = await fetch(`${API}/api/info-hub/entities/search?type=company&limit=10`);
                const topCompanies = await compRes.json();
                topHtml += `<div class="top-card"><h4>🏢 高频公司 Top 10</h4>`;
                for (const c of topCompanies.results?.slice(0,10) || []) {
                    topHtml += `<div class="top-item"><span onclick="searchByEntity('${c.text}')" style="cursor:pointer;">${c.text}</span><span class="count-badge">${c.count}</span></div>`;
                }
                topHtml += '</div>';

                const moneyRes = await fetch(`${API}/api/info-hub/entities/search?type=money&limit=10`);
                const topMoney = await moneyRes.json();
                topHtml += `<div class="top-card"><h4>💰 涉及金额 Top 10</h4>`;
                for (const m of topMoney.results?.slice(0,10) || []) {
                    topHtml += `<div class="top-item"><span onclick="searchByEntity('${m.text}')" style="cursor:pointer;">${m.text}</span><span class="count-badge">${m.count}</span></div>`;
                }
                topHtml += '</div>';

                document.getElementById('topLists').innerHTML = topHtml;
            } catch (e) {
                document.getElementById('insightsStats').innerHTML = `<p style="color:#ef4444;">错误: ${e.message}</p>`;
            }
        }

        // ===== 系统统计 =====
        async function loadAllStats() {
            document.getElementById('statsResults').innerHTML = '<div class="loading">加载中...</div>';

            try {
                const [searchRes, entityRes] = await Promise.all([
                    fetch(`${API}/api/info-hub/stats`),
                    fetch(`${API}/api/info-hub/entities/stats`),
                ]);

                const searchStats = await searchRes.json();
                const entityStats = await entityRes.json();

                let html = '<h3>搜索索引</h3><pre>' + JSON.stringify(searchStats, null, 2) + '</pre>';
                html += '<h3>实体统计</h3><pre>' + JSON.stringify(entityStats, null, 2) + '</pre>';

                // 图谱统计
                if (graphData) {
                    html += '<h3>图谱统计</h3><pre>' + JSON.stringify({
                        version: graphData.version,
                        generated_at: graphData.generated_at,
                        stats: graphData.stats,
                        stats_inference: graphData.stats_inference
                    }, null, 2) + '</pre>';
                }

                document.getElementById('statsResults').innerHTML = html;
            } catch (e) {
                document.getElementById('statsResults').innerHTML = `<p style="color:#ef4444;">错误: ${e.message}</p>`;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // 页面加载完成
        });
    </script>
</body>
</html>
